<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="https://at.alicdn.com/t/c/font_5023613_eq1p0m6xa89.css">
    <style>
        .loading {
            width: 100vw;
            height: 100vh;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 99;
        }

        .loading .iconfont {
            font-size: 40px;
            animation: loading 1.5s infinite;
            opacity: 0.6;
        }

        @keyframes loading {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="loading">
        <i class="iconfont icon-loading"></i>
    </div>
</body>

</html>
